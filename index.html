<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ブラインドタイマー</title>
<style>
  :root{
    --felt-dark:#082a20;
    --felt:#0b3d2e;
    --felt-light:#144a37;
    --gold:#d4af37;
    --gold-dim:#8a742a;
    --cream:#f1e6d0;
    --red:#b33a3a;
    --shadow:rgba(0,0,0,.45);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background:radial-gradient(circle at 50% -10%, #144a37, #0b3d2e 55%, #082a20 100%);
    color:#f1e6d0;
    font-family:'Segoe UI',"Hiragino Sans","Yu Gothic",sans-serif;
    overflow-x:hidden; user-select:none;
  }
  #errBar{
    display:none; position:fixed; top:0; left:0; right:0; z-index:9999;
    background:#b33a3a; color:#fff; font-size:12px; padding:8px 10px;
    line-height:1.5; white-space:pre-wrap; word-break:break-all;
  }
  #app{
    min-height:100dvh; display:flex; flex-direction:column; align-items:center;
    padding:16px 14px calc(24px + env(safe-area-inset-bottom));
    max-width:520px; margin:0 auto;
  }
  header{ width:100%; display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  header h1{ font-size:14px; letter-spacing:.12em; margin:0; color:#d4af37; font-weight:600; text-transform:uppercase; }
  #editBtn{ background:none; border:1px solid #8a742a; color:#d4af37; border-radius:20px; padding:8px 14px; font-size:12px; cursor:pointer; }

  .dial-wrap{ position:relative; width:100%; max-width:340px; aspect-ratio:1/1; margin:18px 0 10px; }
  svg#dial{ width:100%; height:100%; display:block; transform:rotate(-90deg); }
  .dial-track{ fill:none; stroke:rgba(241,230,208,.08); stroke-width:14; }
  .dial-progress{ fill:none; stroke:#d4af37; stroke-width:14; stroke-linecap:round;
    transition:stroke-dashoffset 1s linear, stroke .4s; }
  .dial-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  #levelBadge{ font-size:12px; letter-spacing:.15em; color:#d4af37; background:rgba(212,175,55,.12);
    border:1px solid #8a742a; padding:3px 14px; border-radius:20px; margin-bottom:8px; }
  #clock{ font-variant-numeric:tabular-nums; font-size:64px; font-weight:700;
    font-family:'Consolas','SFMono-Regular',monospace; line-height:1; text-shadow:0 2px 10px rgba(0,0,0,.45); }
  #clock.warn{ color:#e8b84b; }
  #clock.danger{ color:#e05a5a; animation:pulse 1s infinite; }
  @keyframes pulse{ 50%{opacity:.45;} }
  #blindNow{ margin-top:10px; font-size:22px; font-weight:600; }
  #anteNow{ font-size:13px; color:rgba(241,230,208,.65); margin-top:2px; }

  #nextStrip{ width:100%; display:flex; justify-content:center; align-items:center;
    background:rgba(0,0,0,.2); border:1px solid rgba(212,175,55,.2);
    border-radius:14px; padding:10px 16px; margin-top:6px; font-size:13px; }
  #nextStrip .lbl{ color:rgba(241,230,208,.55); }
  #nextStrip .val{ color:#d4af37; font-weight:700; margin-left:10px; font-size:16px; font-variant-numeric:tabular-nums; }

  .controls{ display:flex; gap:12px; width:100%; margin-top:22px; }
  button.ctrl{ flex:1; border:none; border-radius:16px; padding:16px 8px; font-size:15px; font-weight:700;
    cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,.45); transition:transform .08s; }
  button.ctrl:active{ transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.45); }
  button.ctrl:disabled{ opacity:.35; }
  #playPause{ background:#d4af37; color:#082a20; flex:1.4; }
  #prevLevel,#nextLevel{ background:#144a37; color:#f1e6d0; border:1px solid rgba(212,175,55,.3); }
  #resetBtn{ background:#144a37; color:#b33a3a; border:1px solid rgba(179,58,58,.4); }
  .row2{ display:flex; gap:12px; width:100%; margin-top:12px; }

  #infoBar{ display:flex; gap:10px; width:100%; margin-top:16px; }
  .infoBox{ flex:1; background:rgba(0,0,0,.18); border-radius:12px; padding:10px; text-align:center; border:1px solid rgba(255,255,255,.06); }
  .infoBox label{ display:block; font-size:11px; color:rgba(241,230,208,.5); margin-bottom:4px; }
  .infoBox input{ width:100%; background:none; border:none; color:#f1e6d0; font-size:18px; font-weight:700; text-align:center; font-family:inherit; }
  .infoBox input:focus{ outline:none; }
  .infoBox input[type=number]::-webkit-outer-spin-button,
  .infoBox input[type=number]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .infoBox input[type=number]{ -moz-appearance:textfield; }

  .stepper{ display:flex; align-items:center; gap:2px; }
  .stepBtn{ flex:0 0 32px; height:32px; border-radius:8px; background:rgba(212,175,55,.10);
    border:1px solid rgba(212,175,55,.35); color:#d4af37; font-size:14px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding:0; }
  .stepBtn:active{ background:rgba(212,175,55,.3); }
  .stepBtn:disabled{ opacity:.28; }
  .stepper input{ flex:1 1 auto; min-width:0; }

  #levelsPanel{ width:100%; margin-top:18px; display:none; }
  #levelsPanel h2{ font-size:13px; color:#d4af37; letter-spacing:.1em; margin:0 0 8px; }
  .lvRow{ display:grid; grid-template-columns:26px 1fr 1fr 1fr 40px 28px; gap:5px; align-items:center; margin-bottom:6px; }
  .lvRow .idx{ font-size:12px; color:rgba(241,230,208,.5); text-align:center; }
  .lvRow input{ width:100%; background:rgba(0,0,0,.25); border:1px solid rgba(212,175,55,.25);
    border-radius:8px; color:#f1e6d0; padding:8px 2px; font-size:13px; text-align:center; font-family:inherit; }
  .lvRow input.ante{ background:rgba(0,0,0,.12); border-style:dashed; color:rgba(241,230,208,.6); }
  .lvRow.active input{ border-color:#d4af37; }
  .lvRow button.del{ background:none; border:none; color:#b33a3a; font-size:18px; cursor:pointer; padding:0; }
  .lvHead{ display:grid; grid-template-columns:26px 1fr 1fr 1fr 40px 28px; gap:5px; font-size:10px;
    color:rgba(241,230,208,.4); margin-bottom:4px; text-align:center; }
  #addLevelBtn{ width:100%; margin-top:6px; padding:10px; border-radius:10px; border:1px dashed #8a742a;
    background:none; color:#d4af37; font-size:13px; cursor:pointer; }
  #panelActions{ display:flex; gap:10px; margin-top:14px; }
  #panelActions button{ flex:1; padding:12px; border-radius:12px; border:none; font-size:13px; font-weight:700; cursor:pointer; }
  #saveLevelsBtn{ background:#d4af37; color:#082a20; }
  #closePanelBtn{ background:#144a37; color:#f1e6d0; border:1px solid rgba(255,255,255,.1); }
  .note{ font-size:10px; color:rgba(241,230,208,.35); margin:2px 0 10px; }
  footer{ margin-top:20px; font-size:10px; color:rgba(241,230,208,.3); }
</style>
</head>
<body>
<div id="errBar"></div>

<div id="app">
  <header>
    <h1>Blind Timer</h1>
    <button type="button" id="editBtn">レベル編集</button>
  </header>

  <div class="dial-wrap">
    <svg id="dial" viewBox="0 0 200 200">
      <circle class="dial-track" cx="100" cy="100" r="88"/>
      <circle class="dial-progress" id="dialProgress" cx="100" cy="100" r="88"/>
    </svg>
    <div class="dial-center">
      <div id="levelBadge">LEVEL 1</div>
      <div id="clock">10:00</div>
      <div id="blindNow">1 / 2</div>
      <div id="anteNow">Ante 2</div>
    </div>
  </div>

  <div id="nextStrip">
    <div><span class="lbl">次のレベル</span><span class="val" id="nextBlind">2/4/4</span></div>
  </div>

  <div class="controls">
    <button type="button" class="ctrl" id="prevLevel">◀ 前</button>
    <button type="button" class="ctrl" id="playPause">スタート</button>
    <button type="button" class="ctrl" id="nextLevel">次 ▶</button>
  </div>
  <div class="row2">
    <button type="button" class="ctrl" id="resetBtn">リセット</button>
  </div>

  <div id="infoBar">
    <div class="infoBox">
      <label>参加人数</label>
      <div class="stepper">
        <button type="button" class="stepBtn" id="playersMinus">◀</button>
        <input type="number" id="playersInput" value="8" min="1" inputmode="numeric">
        <button type="button" class="stepBtn" id="playersPlus">▶</button>
      </div>
    </div>
    <div class="infoBox">
      <label>合計チップ</label>
      <input type="number" id="totalChipsInput" value="1600" step="100" inputmode="numeric">
    </div>
    <div class="infoBox">
      <label>平均スタック</label>
      <div id="avgStack" style="font-size:18px;font-weight:700;padding-top:4px;">200</div>
    </div>
  </div>

  <div id="levelsPanel">
    <h2>ブラインド構成</h2>
    <div class="lvHead"><div></div><div>SB</div><div>BB</div><div>Ante</div><div>分</div><div></div></div>
    <div id="levelsList"></div>
    <p class="note">※ Ante は BB と同額で自動設定されます</p>
    <button type="button" id="addLevelBtn">＋ レベルを追加</button>
    <div id="panelActions">
      <button type="button" id="closePanelBtn">閉じる</button>
      <button type="button" id="saveLevelsBtn">保存して反映</button>
    </div>
  </div>

  <footer>画面をつけたままにしておくと安心だじゃ</footer>
</div>

<script>
/* ===== エラー可視化 ===== */
function showErr(msg){
  var b = document.getElementById('errBar');
  if(b){ b.style.display = 'block'; b.textContent = 'ERROR: ' + msg; }
}
window.onerror = function(m, s, l, c){ showErr(m + ' (line ' + l + ':' + c + ')'); };

(function(){
  function boot(){
    try{ init(); }catch(e){ showErr(e && e.message ? e.message : String(e)); }
  }

  function init(){
  var STORAGE_KEY = 'blindTimerState_v2';

  var defaultLevels = [
    {sb:1,  bb:2,   ante:2,   min:10},
    {sb:2,  bb:4,   ante:4,   min:10},
    {sb:3,  bb:6,   ante:6,   min:10},
    {sb:4,  bb:8,   ante:8,   min:10},
    {sb:5,  bb:10,  ante:10,  min:10},
    {sb:10, bb:20,  ante:20,  min:10},
    {sb:25, bb:50,  ante:50,  min:10},
    {sb:50, bb:100, ante:100, min:60}
  ];

  var state = {
    levels: defaultLevels.slice(),
    levelIndex: 0,
    secondsLeft: 600,
    players: 8,
    totalChips: 1600
  };

  try{
    var saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    if(saved && saved.levels && saved.levels.length){
      state.levels      = saved.levels;
      state.levelIndex  = saved.levelIndex || 0;
      state.secondsLeft = saved.secondsLeft;
      state.players     = saved.players || 8;
      state.totalChips  = (saved.totalChips == null) ? 1600 : saved.totalChips;
    }
  }catch(e){}

  function num(v, min, def){
    var n = parseInt(v, 10);
    if(isNaN(n)) n = def;
    if(n < min) n = min;
    return n;
  }
  function normalize(){
    var out = [];
    for(var i = 0; i < state.levels.length; i++){
      var l = state.levels[i] || {};
      var bb = num(l.bb, 0, 0);
      out.push({ sb:num(l.sb,0,0), bb:bb, ante:bb, min:num(l.min,1,10) });
    }
    state.levels = out.length ? out : defaultLevels.slice();
    if(state.levelIndex < 0) state.levelIndex = 0;
    if(state.levelIndex > state.levels.length - 1) state.levelIndex = state.levels.length - 1;
    state.players = num(state.players, 1, 8);
    state.totalChips = num(state.totalChips, 0, 0);
  }
  normalize();

  /* ===== 要素取得（欠けていたら通知） ===== */
  var missing = [];
  function $(id){
    var el = document.getElementById(id);
    if(!el) missing.push(id);
    return el;
  }
  var clockEl      = $('clock'),      levelBadge  = $('levelBadge');
  var blindNow     = $('blindNow'),   anteNow     = $('anteNow');
  var nextBlind    = $('nextBlind'),  dialProgress= $('dialProgress');
  var playPauseBtn = $('playPause'),  prevBtn     = $('prevLevel');
  var nextBtn      = $('nextLevel'),  resetBtn    = $('resetBtn');
  var playersInput = $('playersInput'), pMinus    = $('playersMinus');
  var pPlus        = $('playersPlus'), chipsInput = $('totalChipsInput');
  var avgStackEl   = $('avgStack'),   levelsPanel = $('levelsPanel');
  var levelsList   = $('levelsList'), editBtn     = $('editBtn');
  var addLevelBtn  = $('addLevelBtn'),saveBtn     = $('saveLevelsBtn');
  var closeBtn     = $('closePanelBtn');
  if(missing.length){ showErr('要素が見つかりません: ' + missing.join(', ')); return; }

  var CIRC = 2 * Math.PI * 88;
  dialProgress.style.strokeDasharray = CIRC.toFixed(2);

  var running = false, endAt = 0;

  function cur(){ return state.levels[state.levelIndex]; }
  function nxt(){ return state.levels[state.levelIndex + 1] || null; }
  if(!(state.secondsLeft > 0)) state.secondsLeft = cur().min * 60;

  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }
  function fmt(s){
    s = Math.max(0, Math.round(s));
    var m = Math.floor(s / 60), x = s % 60;
    return (m < 10 ? '0' : '') + m + ':' + (x < 10 ? '0' : '') + x;
  }

  var actx = null;
  function beep(n){
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      if(!actx) actx = new AC();
      if(actx.state === 'suspended') actx.resume();
      for(var i = 0; i < (n || 1); i++){
        var t = actx.currentTime + i * 0.28;
        var o = actx.createOscillator(), g = actx.createGain();
        o.type = 'sine'; o.frequency.value = 880;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.3, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
        o.connect(g); g.connect(actx.destination);
        o.start(t); o.stop(t + 0.25);
      }
    }catch(e){}
  }

  function renderInfo(){
    var p = state.players < 1 ? 1 : state.players;
    avgStackEl.textContent = Math.round(state.totalChips / p).toLocaleString();
    pMinus.disabled = (p <= 1);
  }

  function render(){
    var c = cur(), n = nxt();
    levelBadge.textContent = 'LEVEL ' + (state.levelIndex + 1);
    clockEl.textContent = fmt(state.secondsLeft);
    blindNow.textContent = c.sb + ' / ' + c.bb;
    anteNow.textContent = 'Ante ' + c.ante;
    nextBlind.textContent = n ? (n.sb + '/' + n.bb + '/' + n.ante) : '—';

    var s = state.secondsLeft;
    clockEl.className = (s <= 10 ? 'danger' : (s <= 60 ? 'warn' : ''));
    var total = c.min * 60;
    var ratio = total > 0 ? Math.max(0, Math.min(1, s / total)) : 0;
    dialProgress.style.strokeDashoffset = (CIRC * (1 - ratio)).toFixed(2);
    dialProgress.style.stroke = s <= 10 ? '#e05a5a' : (s <= 60 ? '#e8b84b' : '#d4af37');

    playPauseBtn.textContent = running ? '一時停止' : 'スタート';
    prevBtn.disabled = (state.levelIndex === 0);
    nextBtn.disabled = !n;
    renderInfo();
  }

  /* ===== タイマー本体 ===== */
  var lastBeepSec = -1;
  setInterval(function(){
    if(!running) return;
    var left = Math.max(0, (endAt - Date.now()) / 1000);
    var sec = Math.ceil(left);
    if(sec === state.secondsLeft) return;
    state.secondsLeft = sec;

    if(sec > 0 && sec <= 3 && sec !== lastBeepSec){ lastBeepSec = sec; beep(1); }

    if(sec <= 0){
      if(nxt()){
        state.levelIndex++;
        state.secondsLeft = cur().min * 60;
        endAt = Date.now() + state.secondsLeft * 1000;
        beep(2);
      }else{
        running = false; state.secondsLeft = 0; beep(3);
      }
      lastBeepSec = -1;
    }
    save(); render();
  }, 200);

  playPauseBtn.addEventListener('click', function(){
    if(!running && state.secondsLeft <= 0 && !nxt()) return;
    running = !running;
    if(running){
      endAt = Date.now() + state.secondsLeft * 1000;
      beep(1);
    }
    render();
  });

  function goLevel(i){
    if(i < 0 || i >= state.levels.length) return;
    state.levelIndex = i;
    state.secondsLeft = cur().min * 60;
    endAt = Date.now() + state.secondsLeft * 1000;
    lastBeepSec = -1;
    save(); render();
  }
  prevBtn.addEventListener('click', function(){ goLevel(state.levelIndex - 1); });
  nextBtn.addEventListener('click', function(){ goLevel(state.levelIndex + 1); });
  resetBtn.addEventListener('click', function(){
    running = false;
    state.secondsLeft = cur().min * 60;
    lastBeepSec = -1;
    save(); render();
  });

  /* ===== 参加人数 ステッパー ===== */
  function changePlayers(d){
    var v = state.players + d;
    if(v < 1) v = 1;
    state.players = v;
    playersInput.value = v;
    save(); renderInfo();
  }
  function bindRepeat(btn, d){
    var t1 = null, t2 = null, repeated = false;
    function start(){
      if(btn.disabled) return;
      repeated = false;
      t1 = setTimeout(function(){
        t2 = setInterval(function(){ repeated = true; changePlayers(d); }, 100);
      }, 500);
    }
    function stop(){ clearTimeout(t1); clearInterval(t2); }
    btn.addEventListener('click', function(){ if(!repeated) changePlayers(d); });
    btn.addEventListener('mousedown', start);
    btn.addEventListener('touchstart', start, {passive:true});
    ['mouseup','mouseleave','touchend','touchcancel'].forEach(function(ev){
      btn.addEventListener(ev, stop);
    });
  }
  bindRepeat(pMinus, -1);
  bindRepeat(pPlus, 1);

  function onPlayers(){
    state.players = num(playersInput.value, 1, 1);
    save(); renderInfo();
  }
  playersInput.addEventListener('input', onPlayers);
  playersInput.addEventListener('change', onPlayers);
  playersInput.addEventListener('blur', function(){ playersInput.value = state.players; });

  function onChips(){
    state.totalChips = num(chipsInput.value, 0, 0);
    save(); renderInfo();
  }
  chipsInput.addEventListener('input', onChips);
  chipsInput.addEventListener('change', onChips);

  /* ===== レベル編集 ===== */
  function renderLevels(){
    levelsList.innerHTML = '';
    state.levels.forEach(function(l, i){
      var row = document.createElement('div');
      row.className = 'lvRow' + (i === state.levelIndex ? ' active' : '');
      row.innerHTML =
        '<div class="idx">' + (i + 1) + '</div>' +
        '<input type="number" class="sb" value="' + l.sb + '" min="0" inputmode="numeric">' +
        '<input type="number" class="bb" value="' + l.bb + '" min="0" inputmode="numeric">' +
        '<input type="number" class="ante" value="' + l.ante + '" readonly tabindex="-1">' +
        '<input type="number" class="min" value="' + l.min + '" min="1" inputmode="numeric">' +
        '<button type="button" class="del">×</button>';

      var bbEl = row.querySelector('.bb');
      var anEl = row.querySelector('.ante');
      bbEl.addEventListener('input', function(){ anEl.value = num(bbEl.value, 0, 0); });

      row.querySelector('.del').addEventListener('click', function(){
        if(state.levels.length <= 1) return;
        collect();
        state.levels.splice(i, 1);
        if(state.levelIndex > state.levels.length - 1) state.levelIndex = state.levels.length - 1;
        renderLevels();
      });
      levelsList.appendChild(row);
    });
  }

  function collect(){
    var rows = levelsList.querySelectorAll('.lvRow');
    if(!rows.length) return;
    var arr = [];
    for(var i = 0; i < rows.length; i++){
      var bb = num(rows[i].querySelector('.bb').value, 0, 0);
      arr.push({
        sb: num(rows[i].querySelector('.sb').value, 0, 0),
        bb: bb, ante: bb,
        min: num(rows[i].querySelector('.min').value, 1, 10)
      });
    }
    state.levels = arr;
  }

  editBtn.addEventListener('click', function(){
    var open = (levelsPanel.style.display === 'block');
    if(open){
      levelsPanel.style.display = 'none';
    }else{
      renderLevels();
      levelsPanel.style.display = 'block';
    }
  });
  closeBtn.addEventListener('click', function(){ levelsPanel.style.display = 'none'; });

  addLevelBtn.addEventListener('click', function(){
    collect();
    var last = state.levels[state.levels.length - 1];
    var bb = last.bb * 2 || 2;
    state.levels.push({sb:last.bb, bb:bb, ante:bb, min:last.min});
    renderLevels();
  });

  saveBtn.addEventListener('click', function(){
    collect(); normalize();
    if(state.secondsLeft > cur().min * 60) state.secondsLeft = cur().min * 60;
    if(running) endAt = Date.now() + state.secondsLeft * 1000;
    save(); renderLevels(); render();
    saveBtn.textContent = '保存しました';
    setTimeout(function(){ saveBtn.textContent = '保存して反映'; }, 1200);
  });

  /* ===== 初期表示 ===== */
  playersInput.value = state.players;
  chipsInput.value = state.totalChips;
  render();
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', boot);
  }else{
    boot();
  }
})();
</script>
</body>
</html>
