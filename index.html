<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ブラインドタイマー</title>
<style>
  :root{
    --felt-dark:#082a20;
    --felt:#0b3d2e;
    --felt-light:#144a37;
    --gold:#d4af37;
    --gold-dim:#8a742a;
    --cream:#f1e6d0;
    --red:#b33a3a;
    --shadow:rgba(0,0,0,.45);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background:
      radial-gradient(circle at 50% -10%, var(--felt-light), var(--felt) 55%, var(--felt-dark) 100%);
    color:var(--cream);
    font-family:'Segoe UI', "Hiragino Sans", "Yu Gothic", sans-serif;
    overflow-x:hidden;
    user-select:none;
  }
  #app{
    min-height:100dvh;
    display:flex; flex-direction:column;
    align-items:center;
    padding:16px 14px calc(24px + env(safe-area-inset-bottom));
    max-width:520px;
    margin:0 auto;
  }

  /* header */
  header{
    width:100%; display:flex; justify-content:space-between; align-items:center;
    margin-bottom:6px;
  }
  header h1{
    font-size:14px; letter-spacing:.12em; margin:0; color:var(--gold);
    font-weight:600; text-transform:uppercase;
  }
  #editBtn{
    background:none; border:1px solid var(--gold-dim); color:var(--gold);
    border-radius:20px; padding:6px 12px; font-size:12px; cursor:pointer;
  }

  /* chip dial timer */
  .dial-wrap{
    position:relative; width:100%; max-width:340px; aspect-ratio:1/1;
    margin:18px 0 10px;
  }
  svg#dial{ width:100%; height:100%; display:block; transform:rotate(-90deg); }
  .dial-track{ fill:none; stroke:rgba(241,230,208,.08); stroke-width:14; }
  .dial-progress{ fill:none; stroke:var(--gold); stroke-width:14; stroke-linecap:round;
    transition:stroke-dashoffset 1s linear, stroke .4s; }
  .dial-center{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
  }
  #levelBadge{
    font-size:12px; letter-spacing:.15em; color:var(--gold); text-transform:uppercase;
    background:rgba(212,175,55,.12); border:1px solid var(--gold-dim);
    padding:3px 14px; border-radius:20px; margin-bottom:8px;
  }
  #clock{
    font-variant-numeric:tabular-nums;
    font-size:64px; font-weight:700; letter-spacing:.02em;
    font-family:'Consolas','SFMono-Regular',monospace;
    line-height:1;
    text-shadow:0 2px 10px var(--shadow);
  }
  #clock.warn{ color:#e8b84b; }
  #clock.danger{ color:#e05a5a; animation:pulse 1s infinite; }
  @keyframes pulse{ 50%{opacity:.45;} }
  #blindNow{
    margin-top:10px; font-size:22px; font-weight:600; color:var(--cream);
    letter-spacing:.02em;
  }
  #anteNow{ font-size:13px; color:rgba(241,230,208,.65); margin-top:2px; }

  /* next level strip */
  #nextStrip{
    width:100%; display:flex; justify-content:center; align-items:center;
    background:rgba(0,0,0,.2); border:1px solid rgba(212,175,55,.2);
    border-radius:14px; padding:10px 16px; margin-top:6px; font-size:13px;
  }
  #nextStrip span.lbl{ color:rgba(241,230,208,.55); }
  #nextStrip span.val{
    color:var(--gold); font-weight:700; margin-left:10px; font-size:16px;
    font-variant-numeric:tabular-nums; letter-spacing:.02em;
  }

  /* controls */
  .controls{
    display:flex; gap:12px; width:100%; margin-top:22px;
  }
  button.ctrl{
    flex:1; border:none; border-radius:16px; padding:16px 8px;
    font-size:15px; font-weight:700; cursor:pointer; letter-spacing:.03em;
    box-shadow:0 4px 0 var(--shadow);
    transition:transform .08s;
  }
  button.ctrl:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--shadow); }
  #playPause{ background:var(--gold); color:var(--felt-dark); flex:1.4; }
  #prevLevel,#nextLevel{ background:var(--felt-light); color:var(--cream); border:1px solid rgba(212,175,55,.3); }
  #resetBtn{ background:var(--felt-light); color:var(--red); border:1px solid rgba(179,58,58,.4); }

  .row2{ display:flex; gap:12px; width:100%; margin-top:12px; }

  /* players/avg stack quick info */
  #infoBar{
    display:flex; gap:10px; width:100%; margin-top:16px;
  }
  .infoBox{
    flex:1; background:rgba(0,0,0,.18); border-radius:12px; padding:10px;
    text-align:center; border:1px solid rgba(255,255,255,.06);
  }
  .infoBox label{ display:block; font-size:11px; color:rgba(241,230,208,.5); margin-bottom:4px; }
  .infoBox input{
    width:100%; background:none; border:none; color:var(--cream);
    font-size:18px; font-weight:700; text-align:center; font-family:inherit;
  }
  .infoBox input:focus{ outline:none; }
  .infoBox input[type=number]::-webkit-outer-spin-button,
  .infoBox input[type=number]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .infoBox input[type=number]{ -moz-appearance:textfield; }

  /* stepper (参加人数) */
  .stepper{ display:flex; align-items:center; justify-content:space-between; gap:2px; }
  .stepBtn{
    flex:0 0 30px; height:30px; border-radius:8px;
    background:rgba(212,175,55,.10); border:1px solid rgba(212,175,55,.35);
    color:var(--gold); font-size:14px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:transform .08s, background .15s;
  }
  .stepBtn:active{ transform:scale(.9); background:rgba(212,175,55,.28); }
  .stepBtn:disabled{ opacity:.28; cursor:default; }
  .stepper input{ flex:1 1 auto; min-width:0; }

  /* levels table */
  #levelsPanel{
    width:100%; margin-top:18px; display:none;
  }
  #levelsPanel.show{ display:block; }
  #levelsPanel h2{ font-size:13px; color:var(--gold); letter-spacing:.1em; text-transform:uppercase; margin:0 0 8px;}
  .lvRow{
    display:grid; grid-template-columns:28px 1fr 1fr 1fr 44px 30px;
    gap:6px; align-items:center; margin-bottom:6px;
  }
  .lvRow .idx{ font-size:12px; color:rgba(241,230,208,.5); text-align:center; }
  .lvRow input{
    width:100%; background:rgba(0,0,0,.25); border:1px solid rgba(212,175,55,.25);
    border-radius:8px; color:var(--cream); padding:7px 4px; font-size:13px; text-align:center;
    font-family:inherit;
  }
  .lvRow input.ante{
    background:rgba(0,0,0,.12); border-style:dashed;
    color:rgba(241,230,208,.6); pointer-events:none;
  }
  .lvRow.active input{ border-color:var(--gold); }
  .lvRow button.del{
    background:none; border:none; color:var(--red); font-size:18px; cursor:pointer;
  }
  .lvHead{
    display:grid; grid-template-columns:28px 1fr 1fr 1fr 44px 30px;
    gap:6px; font-size:10px; color:rgba(241,230,208,.4); margin-bottom:4px; text-align:center;
  }
  #addLevelBtn{
    width:100%; margin-top:6px; padding:10px; border-radius:10px; border:1px dashed var(--gold-dim);
    background:none; color:var(--gold); font-size:13px; cursor:pointer;
  }
  #panelActions{ display:flex; gap:10px; margin-top:14px; }
  #panelActions button{
    flex:1; padding:12px; border-radius:12px; border:none; font-size:13px; font-weight:700; cursor:pointer;
  }
  #saveLevelsBtn{ background:var(--gold); color:var(--felt-dark); }
  #closePanelBtn{ background:var(--felt-light); color:var(--cream); border:1px solid rgba(255,255,255,.1); }
  .note{ font-size:10px; color:rgba(241,230,208,.35); margin:2px 0 10px; }

  footer{ margin-top:20px; font-size:10px; color:rgba(241,230,208,.3); letter-spacing:.05em; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Blind Timer</h1>
    <button id="editBtn">レベル編集</button>
  </header>

  <div class="dial-wrap">
    <svg id="dial" viewBox="0 0 200 200">
      <circle class="dial-track" cx="100" cy="100" r="88"/>
      <circle class="dial-progress" id="dialProgress" cx="100" cy="100" r="88"/>
    </svg>
    <div class="dial-center">
      <div id="levelBadge">LEVEL 1</div>
      <div id="clock">10:00</div>
      <div id="blindNow">1 / 2</div>
      <div id="anteNow">Ante 2</div>
    </div>
  </div>

  <!-- 「開始まで」を削除し、次レベルのみ表示 -->
  <div id="nextStrip">
    <div><span class="lbl">次のレベル</span><span class="val" id="nextBlind">2/4/4</span></div>
  </div>

  <div class="controls">
    <button class="ctrl" id="prevLevel">◀ 前</button>
    <button class="ctrl" id="playPause">スタート</button>
    <button class="ctrl" id="nextLevel">次 ▶</button>
  </div>
  <div class="row2">
    <button class="ctrl" id="resetBtn">リセット</button>
  </div>

  <div id="infoBar">
    <div class="infoBox">
      <label>参加人数</label>
      <div class="stepper">
        <button class="stepBtn" id="playersMinus" aria-label="人数を減らす">◀</button>
        <input type="number" id="playersInput" value="8" min="1" inputmode="numeric">
        <button class="stepBtn" id="playersPlus" aria-label="人数を増やす">▶</button>
      </div>
    </div>
    <div class="infoBox">
      <label>合計チップ</label>
      <input type="number" id="totalChipsInput" value="1600" step="100" inputmode="numeric">
    </div>
    <div class="infoBox">
      <label>平均スタック</label>
      <div id="avgStack" style="font-size:18px;font-weight:700;padding-top:2px;">200</div>
    </div>
  </div>

  <div id="levelsPanel">
    <h2>ブラインド構成</h2>
    <div class="lvHead"><div></div><div>SB</div><div>BB</div><div>Ante</div><div>分</div><div></div></div>
    <div id="levelsList"></div>
    <p class="note">※ Ante は BB と同額で自動設定されます</p>
    <button id="addLevelBtn">＋ レベルを追加</button>
    <div id="panelActions">
      <button id="closePanelBtn">閉じる</button>
      <button id="saveLevelsBtn">保存して反映</button>
    </div>
  </div>

  <footer>画面をつけたままにしておくと安心だじゃ</footer>
</div>

<script>
(function(){
  const STORAGE_KEY = 'blindTimerState_v1';

  const defaultLevels = [
    {sb:1,  bb:2,   ante:2,   min:10},
    {sb:2,  bb:4,   ante:4,   min:10},
    {sb:3,  bb:6,   ante:6,   min:10},
    {sb:4,  bb:8,   ante:8,   min:10},
    {sb:5,  bb:10,  ante:10,  min:10},
    {sb:10, bb:20,  ante:20,  min:10},
    {sb:25, bb:50,  ante:50,  min:10},
    {sb:50, bb:100, ante:100, min:60},
  ];

  let state = {
    levels: defaultLevels.map(l => Object.assign({}, l)),
    levelIndex: 0,
    secondsLeft: defaultLevels[0].min * 60,
    running: false,
    players: 8,
    totalChips: 1600
  };

  // ---- load ----
  try{
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if(saved && saved.levels && saved.levels.length){
      state = Object.assign(state, saved);
    }
  }catch(e){}

  // Ante は常に BB と同額に正規化
  function normalizeLevels(){
    state.levels = state.levels.map(l => {
      const bb = Math.max(0, Number(l.bb) || 0);
      return {
        sb:  Math.max(0, Number(l.sb) || 0),
        bb:  bb,
        ante: bb,
        min: Math.max(1, Number(l.min) || 1)
      };
    });
    if(!state.levels.length) state.levels = defaultLevels.map(l => Object.assign({}, l));
    state.levelIndex = Math.min(Math.max(0, state.levelIndex|0), state.levels.length - 1);
  }
  normalizeLevels();
  state.running = false;
  if(!(state.secondsLeft > 0)) state.secondsLeft = state.levels[state.levelIndex].min * 60;

  // ---- elements ----
  const clockEl        = document.getElementById('clock');
  const levelBadge     = document.getElementById('levelBadge');
  const blindNow       = document.getElementById('blindNow');
  const anteNow        = document.getElementById('anteNow');
  const nextBlind      = document.getElementById('nextBlind');
  const playPauseBtn   = document.getElementById('playPause');
  const prevLevelBtn   = document.getElementById('prevLevel');
  const nextLevelBtn   = document.getElementById('nextLevel');
  const resetBtn       = document.getElementById('resetBtn');
  const dialProgress   = document.getElementById('dialProgress');
  const playersInput   = document.getElementById('playersInput');
  const playersMinus   = document.getElementById('playersMinus');
  const playersPlus    = document.getElementById('playersPlus');
  const totalChipsInput= document.getElementById('totalChipsInput');
  const avgStackEl     = document.getElementById('avgStack');
  const levelsPanel    = document.getElementById('levelsPanel');
  const levelsList     = document.getElementById('levelsList');
  const editBtn        = document.getElementById('editBtn');
  const addLevelBtn    = document.getElementById('addLevelBtn');
  const saveLevelsBtn  = document.getElementById('saveLevelsBtn');
  const closePanelBtn  = document.getElementById('closePanelBtn');

  const R = 88, CIRC = 2 * Math.PI * R;
  dialProgress.style.strokeDasharray = CIRC.toFixed(2);

  // ---- utils ----
  const fmt = s => {
    s = Math.max(0, Math.floor(s));
    const m = Math.floor(s / 60), sec = s % 60;
    return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
  };
  const cur  = () => state.levels[state.levelIndex];
  const next = () => state.levels[state.levelIndex + 1] || null;

  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }

  // ---- beep (WebAudio) ----
  let actx = null;
  function beep(times){
    try{
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if(actx.state === 'suspended') actx.resume();
      for(let i = 0; i < (times || 1); i++){
        const t = actx.currentTime + i * 0.28;
        const osc = actx.createOscillator(), g = actx.createGain();
        osc.type = 'sine'; osc.frequency.value = 880;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.35, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
        osc.connect(g).connect(actx.destination);
        osc.start(t); osc.stop(t + 0.24);
      }
    }catch(e){}
  }

  // ---- render ----
  function render(){
    const c = cur(), n = next();

    levelBadge.textContent = 'LEVEL ' + (state.levelIndex + 1);
    clockEl.textContent = fmt(state.secondsLeft);
    blindNow.textContent = c.sb + ' / ' + c.bb;
    anteNow.textContent = 'Ante ' + c.ante;

    // 次のレベル: 00/00/00 （SB/BB/Ante）
    nextBlind.textContent = n ? (n.sb + '/' + n.bb + '/' + n.ante) : '—';

    clockEl.classList.toggle('warn',   state.secondsLeft <= 60 && state.secondsLeft > 10);
    clockEl.classList.toggle('danger', state.secondsLeft <= 10);

    const total = c.min * 60;
    const ratio = total > 0 ? Math.max(0, Math.min(1, state.secondsLeft / total)) : 0;
    dialProgress.style.strokeDashoffset = (CIRC * (1 - ratio)).toFixed(2);
    dialProgress.style.stroke =
      state.secondsLeft <= 10 ? '#e05a5a' :
      state.secondsLeft <= 60 ? '#e8b84b' : 'var(--gold)';

    playPauseBtn.textContent = state.running ? '一時停止' : 'スタート';
    prevLevelBtn.disabled = state.levelIndex === 0;
    nextLevelBtn.disabled = !n;

    renderInfo();
  }

  function renderInfo(){
    const p = Math.max(1, Number(state.players) || 1);
    const t = Math.max(0, Number(state.totalChips) || 0);
    avgStackEl.textContent = Math.round(t / p).toLocaleString();
    playersMinus.disabled = p <= 1;
  }

  // ---- timer ----
  let ticker = null;
  function tick(){
    if(!state.running) return;
    state.secondsLeft--;
    if(state.secondsLeft <= 3 && state.secondsLeft > 0) beep(1);
    if(state.secondsLeft <= 0){
      if(next()){
        state.levelIndex++;
        state.secondsLeft = cur().min * 60;
        beep(2);
      }else{
        state.secondsLeft = 0;
        state.running = false;
        beep(3);
      }
    }
    save();
    render();
  }
  function startTicker(){
    clearInterval(ticker);
    ticker = setInterval(tick, 1000);
  }
  startTicker();

  playPauseBtn.addEventListener('click', () => {
    if(state.secondsLeft <= 0 && !next()) return;
    state.running = !state.running;
    if(state.running) beep(1);
    save(); render();
  });

  function goLevel(i){
    if(i < 0 || i >= state.levels.length) return;
    state.levelIndex = i;
    state.secondsLeft = cur().min * 60;
    save(); render();
  }
  prevLevelBtn.addEventListener('click', () => goLevel(state.levelIndex - 1));
  nextLevelBtn.addEventListener('click', () => goLevel(state.levelIndex + 1));

  resetBtn.addEventListener('click', () => {
    state.running = false;
    state.secondsLeft = cur().min * 60;
    save(); render();
  });

  // ---- 参加人数：矢印タップ／長押し ----
  function changePlayers(delta){
    const v = Math.max(1, (Number(state.players) || 1) + delta);
    state.players = v;
    playersInput.value = v;
    save(); renderInfo();
  }
  function bindHold(btn, delta){
    let to = null, iv = null;
    const stop = () => { clearTimeout(to); clearInterval(iv); to = iv = null; };
    btn.addEventListener('pointerdown', e => {
      e.preventDefault();
      if(btn.disabled) return;
      changePlayers(delta);
      to = setTimeout(() => { iv = setInterval(() => changePlayers(delta), 100); }, 450);
    });
    ['pointerup','pointerleave','pointercancel'].forEach(ev => btn.addEventListener(ev, stop));
  }
  bindHold(playersMinus, -1);
  bindHold(playersPlus,  +1);

  playersInput.addEventListener('input', () => {
    state.players = Math.max(1, Number(playersInput.value) || 1);
    save(); renderInfo();
  });
  playersInput.addEventListener('blur', () => { playersInput.value = state.players; });

  totalChipsInput.addEventListener('input', () => {
    state.totalChips = Math.max(0, Number(totalChipsInput.value) || 0);
    save(); renderInfo();
  });

  // ---- levels editor ----
  function renderLevels(){
    levelsList.innerHTML = '';
    state.levels.forEach((l, i) => {
      const row = document.createElement('div');
      row.className = 'lvRow' + (i === state.levelIndex ? ' active' : '');
      row.innerHTML =
        '<div class="idx">' + (i + 1) + '</div>' +
        '<input type="number" class="sb"   value="' + l.sb  + '" min="0" inputmode="numeric">' +
        '<input type="number" class="bb"   value="' + l.bb  + '" min="0" inputmode="numeric">' +
        '<input type="number" class="ante" value="' + l.ante + '" readonly tabindex="-1">' +
        '<input type="number" class="min"  value="' + l.min + '" min="1" inputmode="numeric">' +
        '<button class="del" aria-label="削除">×</button>';

      // BB を変えたら Ante を追従
      const bbEl = row.querySelector('.bb');
      const anteEl = row.querySelector('.ante');
      bbEl.addEventListener('input', () => { anteEl.value = Math.max(0, Number(bbEl.value) || 0); });

      row.querySelector('.del').addEventListener('click', () => {
        if(state.levels.length <= 1) return;
        collect();
        state.levels.splice(i, 1);
        if(state.levelIndex >= state.levels.length) state.levelIndex = state.levels.length - 1;
        renderLevels();
      });

      levelsList.appendChild(row);
    });
  }

  // 画面上の入力値を state に取り込む（Ante は BB に強制同期）
  function collect(){
    const rows = levelsList.querySelectorAll('.lvRow');
    const arr = [];
    rows.forEach(r => {
      const bb = Math.max(0, Number(r.querySelector('.bb').value) || 0);
      arr.push({
        sb:  Math.max(0, Number(r.querySelector('.sb').value) || 0),
        bb:  bb,
        ante: bb,
        min: Math.max(1, Number(r.querySelector('.min').value) || 1)
      });
    });
    if(arr.length) state.levels = arr;
  }

  editBtn.addEventListener('click', () => {
    const show = !levelsPanel.classList.contains('show');
    levelsPanel.classList.toggle('show', show);
    if(show){ renderLevels(); levelsPanel.scrollIntoView({behavior:'smooth', block:'start'}); }
  });

  addLevelBtn.addEventListener('click', () => {
    collect();
    const last = state.levels[state.levels.length - 1];
    const bb = last.bb * 2;
    state.levels.push({sb: last.bb, bb: bb, ante: bb, min: last.min});
    renderLevels();
  });

  saveLevelsBtn.addEventListener('click', () => {
    collect();
    normalizeLevels();
    if(state.secondsLeft > cur().
